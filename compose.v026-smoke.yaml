# ProxyCircuit v0.2.6 Beta | Author: Mohammad Zamir Akbari | https://zamir.akbari.org
# ISOLATED DOCKER SMOKE TEST. No WireGuard privileges, no public HTTP/HTTPS ports.
services:
  proxycircuit:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: proxycircuit:0.2.6-beta-smoke
    container_name: proxycircuit-v026-smoke
    restart: 'no'
    ports:
      - '127.0.0.1:19446:9443/tcp'
    volumes:
      - pc_v026_data:/var/lib/rpmgr
      - pc_v026_admin_tls:/etc/rpmgr
      - pc_v026_acme:/etc/letsencrypt
      - pc_v026_acme_webroot:/var/www/rpmgr-acme
      - pc_v026_fallback:/var/www/rpmgr-fallback
      - pc_v026_nginx_logs:/var/log/nginx
    security_opt:
      - no-new-privileges:true
volumes:
  pc_v026_data:
  pc_v026_admin_tls:
  pc_v026_acme:
  pc_v026_acme_webroot:
  pc_v026_fallback:
  pc_v026_nginx_logs:
